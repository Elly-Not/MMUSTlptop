name: mmust_laptop_clearance
description: MMUST Digital Laptop Clearance & Gate Security System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # QR Code Scanning & Generation
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  
  # Networking & Authentication
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  
  # State Management
  provider: ^6.1.2
  
  # Local Caching & Offline Gate Sync (Critical Requirement)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  
  # Audio Alerts (For Stolen Blacklist Sirens & Cleared Chimes)
  audioplayers: ^6.0.0
  
  # File & Image Export
  image_gallery_saver: ^2.0.3
  csv: ^6.0.0
  share_plus: ^9.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Automatic Launcher Icon Generator using MMUST University Logo
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

# MMUST University Launcher Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/mmust_logo.png"
  adaptive_icon_background: "#0B4F9C" # MMUST Deep Royal Blue
  adaptive_icon_foreground: "assets/images/mmust_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/mmust_logo.png"
    background_color: "#0B4F9C"
    theme_color: "#0B4F9C"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
